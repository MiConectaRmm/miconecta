services:
  postgres:
    image: postgres:16
    container_name: miconecta_postgres
    restart: unless-stopped
    env_file:
      - /opt/miconecta/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - miconecta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - miconecta-network

  redis:
    image: redis:7
    container_name: miconecta_redis
    restart: unless-stopped
    env_file:
      - /opt/miconecta/.env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - miconecta_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - miconecta-network

  backend:
    build:
      context: /opt/miconecta
      dockerfile: Dockerfile.backend
    container_name: miconecta_backend
    restart: unless-stopped
    env_file:
      - /opt/miconecta/.env
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}

      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      RUSTDESK_SERVER: ${RUSTDESK_SERVER}
      RUSTDESK_KEY: ${RUSTDESK_KEY}

      BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      WS_URL: ${WS_URL}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - miconecta-network

volumes:
  miconecta_postgres_data:
  miconecta_redis_data:

networks:
  miconecta-network:
    driver: bridge
