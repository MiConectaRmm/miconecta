# Produção (domínio público): https://api.maginf.com.br — painel: https://app.maginf.com.br
app = "miconecta-backend"
primary_region = "gru"

# 256MB mata o Node com OOM (exit 137) sob Nest + Socket.IO + agentes. Mínimo recomendado: 1GB.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # Heap V8 limitado para sobrar memória nativa (DB, buffers Socket.IO, TLS).
  NODE_OPTIONS = "--max-old-space-size=768"
  CORS_ORIGIN = "https://app.maginf.com.br,https://www.app.maginf.com.br,https://miconecta-frontend.fly.dev"
  PUBLIC_API_URL = "https://api.maginf.com.br"
  DB_SSL = "false"

# Equivalente a [http_service], mas com tcp_checks: o probe HTTP esgotava timeout sob carga de
# Socket.IO (polling) e a Fly marcava a máquina unhealthy → 503 para tudo.
[[services]]
  protocol = "tcp"
  internal_port = 3000
  processes = ["app"]
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  # "requests" costuma funcionar melhor que "connections" com long-polling / WebSocket.
  [services.concurrency]
    type = "requests"
    soft_limit = 500
    hard_limit = 1000

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
